[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[google,images]>=1.6.9",
    "livekit-plugins-ai-coustics~=0.2",
    # Cloud-free `direct` pipeline (JARVIS_PIPELINE=direct): local Silero VAD
    # endpointing + local faster-whisper ears. Pinned to the 1.6 line so
    # livekit-agents itself never churns (1.8 requires an agents upgrade).
    "livekit-plugins-silero~=1.6",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "playwright>=1.62.0",
    "python-dotenv",
    "sounddevice>=0.5.5",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.optional-dependencies]
# Local semantic routing (Needle 2, 14MB offline tool-calling model).
# Install with: uv sync --extra needle. Disabled at runtime with JARVIS_NEEDLE=0.
needle = [
    "cactus-needle>=2.0",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
