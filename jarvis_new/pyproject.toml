[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Jarvis voice butler: in-repo voice runtime (jarvis_rt) with Gemini Live"
requires-python = ">=3.10, <3.15"

dependencies = [
    # In-repo voice runtime (src/jarvis_rt): Gemini Live client, WebSocket
    # voice hub, Silero VAD via onnxruntime (no LiveKit packages).
    "google-genai>=2.18.1",
    "pydantic>=2.13",
    "docstring-parser>=0.18",
    "json-repair>=0.60",
    "certifi",
    "numpy>=2.2",
    "pillow>=12.3",
    # Local `direct` pipeline ears (faster-whisper) and voice (Piper).
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "playwright>=1.62.0",
    "python-dotenv",
    "sounddevice>=0.5.5",
    "websockets>=12.0",
    "opencv-python-headless<5",
    # Eyes / Hollow Hands: local pose, object and gesture models.
    "mediapipe>=1.0.1",
    # Focus mode: KWin active-window over D-Bus (pure Python).
    "jeepney>=0.9.0",
    "yt-dlp[default]>=2026.8.19",
    "onnxruntime>=1.24.3",
    "cryptography>=43",
    "segno==1.6.1",
]

[dependency-groups]
dev = [
    "memray>=1.20.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.optional-dependencies]
# Local semantic routing (Cactus Needle 3, offline tool-calling model).
# Install with: uv sync --extra needle. Disabled at runtime with JARVIS_NEEDLE=0.
needle = [
    "cactus-needle>=3.2.8,<4",
]

# Games (chess): install with `uv sync --extra chess`.
chess = [
    "chess>=1.10",
    "httpx>=0.27",
    "rich>=13",
    "textual>=0.60",
    "pyfiglet>=1.0",
    "websockets>=12.0",
]

[project.scripts]
chess = "games.cli:main"

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_llm: needs a real Gemini Live model call; skipped unless JARVIS_LIVE_LLM=1",
    "slow: loads real whisper / Piper models; deselect with -m 'not slow'",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
