<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LOCKE</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">
  <section class="box" id="tabsBox">
    <h2 class="hd"><span>Tabs</span><span id="count" class="amber"></span></h2>
    <label class="cmd"><span class="prompt">Filter</span><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="filter title / url" autofocus></label>
    <div id="list" role="listbox"></div>
    <div class="bar">
      <button id="discard" class="btn" type="button">Discard background tabs</button>
      <span id="discardMsg" class="dim"></span>
    </div>
  </section>
  <div class="foot dim">&uarr;&darr; select &middot; enter jump &middot; mid-click close</div>
</div>
<script src="popup.js"></script>
</body>
</html>
